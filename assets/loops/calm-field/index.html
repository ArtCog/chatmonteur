<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0B0B0C;               /* brand ink */
      }
      .blob {
        position: absolute; border-radius: 50%; filter: blur(90px);
        will-change: transform;
      }
      /* Motion WITHOUT information: nothing here has an edge the eye can try to read. */
      #b1 { width: 1100px; height: 1100px; left: -180px; top: -260px;
            background: radial-gradient(circle, rgba(232,237,235,.13) 0%, transparent 66%) }
      #b2 { width:  880px; height:  880px; left: 1080px; top: 380px;
            background: radial-gradient(circle, rgba(232,237,235,.10) 0%, transparent 68%) }
      #b3 { width:  700px; height:  700px; left:  620px; top: 700px;
            background: radial-gradient(circle, rgba(232,237,235,.07) 0%, transparent 70%) }
      /* A barely-there grain so flat gradients don't band on YouTube's encoder. */
      #grain {
        position: absolute; inset: 0; opacity: .045; mix-blend-mode: screen;
        background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px);
        background-size: 3px 3px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12"
         data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
      <div id="b1" class="blob"></div>
      <div id="b2" class="blob"></div>
      <div id="b3" class="blob"></div>
      <div id="grain"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // sine.inOut per the motion philosophy — never linear, and the ends match the
      // starts so the 12s clip can be looped without a visible seam.
      tl.to("#b1", { x: 260, y: 150, duration: 6, ease: "sine.inOut" }, 0)
        .to("#b1", { x: 0, y: 0, duration: 6, ease: "sine.inOut" }, 6)
        .to("#b2", { x: -220, y: -180, duration: 6, ease: "sine.inOut" }, 0)
        .to("#b2", { x: 0, y: 0, duration: 6, ease: "sine.inOut" }, 6)
        .to("#b3", { x: 160, y: -120, duration: 6, ease: "sine.inOut" }, 0)
        .to("#b3", { x: 0, y: 0, duration: 6, ease: "sine.inOut" }, 6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
