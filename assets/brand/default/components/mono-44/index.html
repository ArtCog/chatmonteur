<!doctype html>
<html data-composition-variables='[
  {"id":"kicker","type":"string","label":"What is waiting there","default":"КОДЫ ИЗ ЭТОГО ВИДЕО"},
  {"id":"text","type":"string","label":"Destination","default":"Telegram-канал"}
]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 44 «ТГ · полная плашка». Alpha overlay over continuing
     footage: the generated QR always comes from channel.json. @Art_Cog is
     Artur's personal account and is forbidden as a channel CTA. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-44" data-start="0" data-duration="7"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <div style="position:absolute;right:110px;bottom:170px">
    <div id="m44-plate" data-layout-allow-caption-zone style="background:var(--ink);padding:28px 36px;
         display:flex;align-items:center;gap:32px;box-shadow:0 38px 100px -36px rgba(0,0,0,.78)">
      <div id="m44-qr" style="width:190px;height:190px;background:var(--paper);padding:13px;flex:0 0 auto">
        <img src="assets/tg-qr.png" alt="QR-код Telegram-канала ИИмерсивный"
             style="width:100%;height:100%;object-fit:contain;display:block">
      </div>
      <div id="m44-copy">
        <div data-var-text="kicker" style="font-family:'JetBrains Mono',monospace;font-size:29px;
             letter-spacing:.18em;color:var(--gray-1)">КОДЫ ИЗ ЭТОГО ВИДЕО</div>
        <div style="display:flex;align-items:center;gap:20px;margin-top:15px">
          <span id="m44-glyph" style="display:flex;color:var(--paper)">
            <svg viewBox="0 0 24 24" width="54" height="54" style="display:block"><path fill="currentColor"
              d="M22 3 1.8 11.2c-.8.3-.8 1 0 1.3l4.9 1.6 1.9 5.9c.2.6.6.7 1 .3l2.7-2.3 4.9 3.6c.5.4 1 .2 1.2-.5L22.9 4c.2-.8-.3-1.2-.9-1Z"/></svg>
          </span>
          <span data-var-text="text" style="font-family:'Golos Text',sans-serif;font-weight:900;
                font-size:62px;line-height:1.1;color:var(--paper)">Telegram-канал</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.fromTo("#m44-plate", { y: 20, scale: 0.96, opacity: 0 },
            { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);
  tl.fromTo("#m44-qr", { scale: 0.96, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.12);
  tl.fromTo("#m44-copy", { x: 16, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);
  tl.fromTo("#m44-glyph", { y: 0, rotate: 0 },
            { y: -3, rotate: -2, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.7);
  tl.to("#m44-plate", { y: 18, opacity: 0, duration: 0.4, ease: "power2.in" }, 6.6);

  window.__timelines["mono-44"] = tl;
</script>
</body>
</html>
