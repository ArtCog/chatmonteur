<head>
<meta charset="utf-8">

     clears the manifest's playerZone; right 104 is the manifest's side margin.
     It hangs 10–15s, so duration is 12. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }

<div id="root" data-composition-id="mono-43" data-start="0" data-duration="12"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <div id="m43-wrap" style="position:absolute;right:104px;bottom:146px;display:flex;
       flex-direction:column;align-items:flex-end;gap:23px">

  tl.to("#m43-wrap", { x: 88, opacity: 0, duration: 0.4, ease: "power2.in" }, 11.6);

  window.__timelines["mono-43"] = tl;
