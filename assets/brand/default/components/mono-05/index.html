<!doctype html>
<html data-composition-variables='[
  {"id":"x","type":"number","label":"Bracket left, px","default":239},
  {"id":"y","type":"number","label":"Bracket top, px","default":311},
  {"id":"w","type":"number","label":"Bracket width, px","default":649},
  {"id":"h","type":"number","label":"Bracket height, px","default":389},
  {"id":"kicker","type":"string","label":"Label kicker","default":"СМОТРИ СЮДА"},
  {"id":"label","type":"string","label":"Label text","default":"эта команда"},
  {"id":"hint","type":"string","label":"Inverse hint chip — leave empty to drop it","default":"важный момент"}
]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 05 «выноска / акцент» — ported from the designer's source
     (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Overlay, so the page stays transparent.

     A callout is worthless if it cannot point at the thing it is about, so the
     bracket's rectangle is exposed as x/y/w/h; the connector and the label plate
     follow the right edge on their own. His numbers are the defaults. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-05" data-start="0" data-duration="5"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <div id="m5-callout" style="position:absolute;left:239px;top:311px">
    <div id="m5-box" style="position:relative;width:649px;height:389px">
      <div style="position:absolute;left:0;top:0;width:67px;height:67px;border-left:8px solid var(--paper);border-top:8px solid var(--paper)"></div>
      <div style="position:absolute;right:0;top:0;width:67px;height:67px;border-right:8px solid var(--paper);border-top:8px solid var(--paper)"></div>
      <div style="position:absolute;left:0;bottom:0;width:67px;height:67px;border-left:8px solid var(--paper);border-bottom:8px solid var(--paper)"></div>
      <div style="position:absolute;right:0;bottom:0;width:67px;height:67px;border-right:8px solid var(--paper);border-bottom:8px solid var(--paper)"></div>
    </div>
    <div id="m5-line" style="position:absolute;left:649px;top:31px;width:239px;height:8px;background:var(--paper)"></div>
    <div id="m5-label" style="position:absolute;left:888px;top:-57px;background:var(--paper);color:var(--ink);
         padding:29px 42px;box-shadow:0 26px 73px rgba(0,0,0,.5)">
      <div data-var-text="kicker" style="font-family:'JetBrains Mono',monospace;font-size:26px;
           letter-spacing:.2em;color:var(--gray-2);margin-bottom:8px">СМОТРИ СЮДА</div>
      <div data-var-text="label" style="font-family:'Golos Text',sans-serif;font-weight:800;
           font-size:54px;line-height:1.1;white-space:nowrap">эта команда</div>
    </div>
  </div>

  <div id="m5-hint" style="position:absolute;left:239px;bottom:223px;display:inline-flex;
       align-items:center;gap:26px;background:var(--ink);color:var(--paper);padding:29px 44px;
       box-shadow:0 26px 73px rgba(0,0,0,.5)">
    <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:44px">→</span>
    <span data-var-text="hint" style="font-family:'Golos Text',sans-serif;font-weight:800;font-size:52px">важный момент</span>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  const num = (v, d) => (v === undefined || v === null || v === "" ? d : Number(v));

  const w = num(vars.w, 649);
  const callout = document.getElementById("m5-callout");
  callout.style.left = num(vars.x, 239) + "px";
  callout.style.top = num(vars.y, 311) + "px";
  const box = document.getElementById("m5-box");
  box.style.width = w + "px";
  box.style.height = num(vars.h, 389) + "px";
  document.getElementById("m5-line").style.left = w + "px";
  document.getElementById("m5-label").style.left = (w + 239) + "px";

  const hint = document.getElementById("m5-hint");
  const hasHint = String(vars.hint ?? "важный момент").trim() !== "";
  if (!hasHint) hint.remove();

  const tl = gsap.timeline({ paused: true });
  // the bracket lands first and the hint follows half a second later, as on the card
  tl.fromTo("#m5-callout", { scale: 0.9, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.5, ease: "circ.out" }, 0.05);
  if (hasHint) {
    tl.fromTo("#m5-hint", { scale: 0.9, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.5, ease: "circ.out" }, 0.55);
  }
  const leaving = hasHint ? ["#m5-callout", "#m5-hint"] : ["#m5-callout"];
  tl.to(leaving, { scale: 0.9, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.6);

  window.__timelines["mono-05"] = tl;
</script>
</body>
</html>
