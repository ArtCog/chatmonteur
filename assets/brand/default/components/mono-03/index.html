<!doctype html>
<html data-composition-variables='[
  {"id":"name","type":"string","label":"Name","default":"Джулиан Иванов"},
  {"id":"role","type":"string","label":"Role","default":"AI Automation · автор"}
]'>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 03 «плашка-имя» — ported 1:1 from the designer's source
     (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Overlay over footage, so the page stays
     transparent. CSS clipUp becomes a GSAP timeline; CSS is not seekable. */
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-03" data-start="0" data-duration="5"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <!-- bottom-left, clear of the player zone; the light tick is the shared marker
       this element carries with the question plate K and the paragraph M -->
  <div id="m3-wrap" style="position:absolute;left:130px;bottom:135px;display:flex">
    <div style="width:13px;background:#FAFAF7"></div>
    <div style="background:#0B0B0C;padding:39px 62px">
      <!-- line-height 1.2, not the designer's 1: Playfair's descenders (Д, у, р)
           sit below the em box, and at 70px a flat line-height clips them -->
      <div data-var-text="name" style="font-family:'Playfair Display',serif;font-weight:600;
           font-size:70px;color:#FAFAF7;line-height:1.2">Джулиан Иванов</div>
      <div data-var-text="role" style="font-family:'JetBrains Mono',monospace;font-size:34px;
           letter-spacing:.14em;color:#B7B7B2;margin-top:16px;text-transform:uppercase">AI Automation · автор</div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.fromTo("#m3-wrap", { clipPath: "inset(0 0 100% 0)", opacity: 0 },
            { clipPath: "inset(0 0 0% 0)", opacity: 1, duration: 0.6, ease: "circ.out" }, 0.05);
  tl.to("#m3-wrap", { clipPath: "inset(0 0 100% 0)", opacity: 0,
                      duration: 0.35, ease: "power2.in" }, 4.55);

  window.__timelines["mono-03"] = tl;
</script>
</body>
</html>
