<!doctype html>
<html data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker","default":"ПАРТНЁР ВЫПУСКА"},
  {"id":"disclosure","type":"string","label":"Disclosure — required by law, do not blank it","default":"реклама"},
  {"id":"logo","type":"string","label":"Logo image path, 250×110 — empty shows the slot","default":""}
]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 37 «партнёр выпуска» — ported from the designer's source
     (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Overlay, so the page stays transparent.

     His 96×42 logo slot lands on 249×109, and his own spec says «в 1920 — 250×110»,
     which is the check that the whole ×2.595 conversion is right.

     Bottom-right and clear of the subtitle band, because this holds 5–7s and
     subtitles keep running underneath it. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-37" data-start="0" data-duration="7"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <div id="m37-plate" style="position:absolute;right:114px;bottom:125px;display:flex;align-items:center;
       gap:42px;background:var(--paper);padding:36px 47px;box-shadow:0 47px 114px -42px rgba(0,0,0,.6)">
    <div style="text-align:right">
      <div data-var-text="kicker" style="font-family:'JetBrains Mono',monospace;font-size:26px;
           letter-spacing:.24em;color:var(--gray-2)">ПАРТНЁР ВЫПУСКА</div>
      <div data-var-text="disclosure" style="font-family:'Golos Text',sans-serif;font-weight:800;
           font-size:49px;color:var(--ink);margin-top:10px;line-height:1.15">реклама</div>
    </div>
    <div style="width:3px;height:109px;background:var(--line);flex:none"></div>
    <div id="m37-logo" style="width:249px;height:109px;background:#ECECE8;display:flex;
         align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
         font-size:25px;letter-spacing:.2em;color:var(--gray-2);flex:none">ЛОГО</div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};

  const logo = String(vars.logo ?? "").trim();
  if (logo) {
    const slot = document.getElementById("m37-logo");
    slot.style.background = "transparent";
    slot.innerHTML = `<img src="${logo.replace(/"/g, "&quot;")}"
      style="max-width:249px;max-height:109px;object-fit:contain">`;
  }

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#m37-plate", { clipPath: "inset(0 0 100% 0)", opacity: 0 },
            { clipPath: "inset(0 0 0% 0)", opacity: 1, duration: 0.6, ease: "circ.out" }, 0.05);
  tl.to("#m37-plate", { clipPath: "inset(0 0 100% 0)", opacity: 0,
                        duration: 0.35, ease: "power2.in" }, 6.6);

  window.__timelines["mono-37"] = tl;
</script>
</body>
</html>
