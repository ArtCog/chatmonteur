<!doctype html>
<html data-composition-variables='[
  {"id":"text","type":"string","label":"Aside","default":"версия 2.1 и выше"}
]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Element L «сноска» (aside) — a quiet clarifying remark on the right:
     a gray dash + JetBrains Mono line, slides in from the right. The spec's
     own conversion note: «моно 17px = 44px в 1920». Ported at ×2.595. */
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="accent-l" data-start="0" data-duration="4"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <!-- right 145px, bottom 151px (source 56/58 × 2.595) -->
  <div id="al-wrap" style="position:absolute;right:145px;bottom:151px;
       display:flex;align-items:center;gap:29px">
    <span style="width:67px;height:3px;background:var(--gray-2)"></span>
    <span id="al-text" data-var-text="text" style="font-family:'JetBrains Mono',monospace;
          font-size:44px;letter-spacing:.06em;color:var(--paper);
          text-shadow:0 3px 26px rgba(0,0,0,.9)">версия 2.1 и выше</span>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  // enter: tickerIn — slides in from the right (source 30px × 2.595 = 78px)
  tl.fromTo("#al-wrap", { x: 78, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.50, ease: "circ.out" }, 0.05);
  // hold, then leave the way it came
  tl.to("#al-wrap", { x: 78, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.55);
  window.__timelines["accent-l"] = tl;
</script>
</body>
</html>
