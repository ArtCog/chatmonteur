<!doctype html>
<html data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker (mono)","default":"А ЕСЛИ"},
  {"id":"question","type":"string","label":"Question","default":"агент ошибётся?"}
]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Element K «вопрос-хук» (question) — ported 1:1 from the designer's source
     (source/ИИмерсивный - Акцентные плашки.dc.html, 740×416 frame) at the
     manifest's scaleToRender 2.595 → 1920×1080. CSS riseIn becomes a GSAP
     timeline; CSS animations are not seekable by the renderer. */
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="accent-k" data-start="0" data-duration="4"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <div id="ak-wrap" style="position:absolute;left:0;right:0;bottom:135px;display:flex;justify-content:center">
    <div style="display:flex;align-items:stretch">
      <div style="width:13px;background:var(--paper)"></div>
      <div style="background:var(--ink);padding:34px 62px">
        <div data-var-text="kicker" style="font-family:'JetBrains Mono',monospace;font-size:29px;
             letter-spacing:.26em;color:var(--gray-1)">А ЕСЛИ</div>
        <div data-var-text="question" style="font-family:'Playfair Display',serif;font-weight:600;
             font-size:88px;line-height:1.1;color:var(--paper);margin-top:10px">агент ошибётся?</div>
      </div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // one gesture, no internal staging: the plate opens an attention loop and must
  // hold whole until the answer starts (designer: «держать до начала ответа»)
  tl.fromTo("#ak-wrap", { y: 67, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "circ.out" }, 0.05);
  tl.to("#ak-wrap", { y: 67, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.55);

  window.__timelines["accent-k"] = tl;
</script>
</body>
</html>
