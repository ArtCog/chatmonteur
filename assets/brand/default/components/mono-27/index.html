<!doctype html>
<html data-composition-variables='[
  {"id":"quote","type":"string","label":"Quote (≤ 9 words)","default":"Мы перестали писать код — мы описываем результат"},
  {"id":"author","type":"string","label":"Attribution","default":"Джулиан Иванов · AI Automation"}
]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 27 «цитата на кадре» — ported from the designer's source
     (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Overlay: the scrim IS the graphic here, so
     the page stays transparent and the gradient carries its own alpha.

     The scrim only darkens the left — the right stays clear so the shot can still
     be read behind the quote. */
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-27" data-start="0" data-duration="6"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <div id="m27-scrim" style="position:absolute;inset:0;background:linear-gradient(90deg,
       rgba(8,9,10,.9) 0%,rgba(8,9,10,.78) 52%,rgba(8,9,10,0) 96%)"></div>

  <div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 597px 0 145px">
    <div id="m27-text" style="width:100%">
      <div data-var-text="quote" style="font-family:'Playfair Display',serif;font-style:italic;
           font-weight:600;font-size:93px;line-height:1.26;color:var(--paper);text-wrap:pretty">Мы перестали писать код — мы описываем результат</div>
      <div style="display:flex;align-items:center;gap:31px;margin-top:52px">
        <span style="width:88px;height:5px;background:var(--paper);flex:none"></span>
        <span data-var-text="author" style="font-family:'JetBrains Mono',monospace;font-size:31px;
              letter-spacing:.2em;color:var(--gray-1);text-transform:uppercase">Джулиан Иванов · AI Automation</span>
      </div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // the scrim lands first and leaves last — the quote rides on top of it
  tl.fromTo("#m27-scrim", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0);
  tl.fromTo("#m27-text", { y: 52, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: "circ.out" }, 0.2);
  tl.to("#m27-text", { y: 52, opacity: 0, duration: 0.35, ease: "power2.in" }, 5.35);
  tl.to("#m27-scrim", { opacity: 0, duration: 0.4, ease: "power2.in" }, 5.5);

  window.__timelines["mono-27"] = tl;
</script>
</body>
</html>
