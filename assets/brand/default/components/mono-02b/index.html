<!doctype html>
<html data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker","default":"тема выпуска"},
  {"id":"title","type":"string","label":"Title (words animate in turn)","default":"Автоматизация монтажа"},
  {"id":"ghost","type":"string","label":"Ghost word behind","default":"ТЕМА"}
]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 02·B «титульная · призрак-слово» — ported 1:1 from the
     designer's source (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the
     manifest's scaleToRender 2.595 → 1920×1080. Full-frame card, opaque ink
     background. CSS softIn/drift become a GSAP timeline; CSS is not seekable. */
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-02b" data-start="0" data-duration="5"
     data-width="1920" data-height="1080"
     style="position:relative;width:1920px;height:1080px;background:var(--ink);overflow:hidden">
  <div style="position:absolute;inset:0;background-image:
       linear-gradient(rgba(250,250,247,.05) 2px,transparent 2px),
       linear-gradient(90deg,rgba(250,250,247,.05) 2px,transparent 2px);
       background-size:114px 114px"></div>

  <!-- the ghost word is outline-only and cropped by the frame: it reads as
       texture behind the title, never as a second headline -->
  <div id="m2-ghost" data-var-text="ghost" style="position:absolute;left:0;right:0;bottom:-99px;
       text-align:center;font-family:'Playfair Display',serif;font-weight:600;font-size:519px;
       line-height:.7;color:transparent;-webkit-text-stroke:3px rgba(250,250,247,.05);
       white-space:nowrap">ТЕМА</div>

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:52px;text-align:center;padding:0 208px">
    <div id="m2-kicker" style="display:flex;align-items:center;gap:36px;
         font-family:'JetBrains Mono',monospace;font-size:31px;letter-spacing:.34em;
         color:var(--gray-2);text-transform:uppercase">
      <span style="width:73px;height:2px;background:var(--gray-2)"></span>
      <span data-var-text="kicker">тема выпуска</span>
      <span style="width:73px;height:2px;background:var(--gray-2)"></span>
    </div>
    <div id="m2-title" style="font-family:'Playfair Display',serif;font-weight:600;
         font-size:151px;line-height:1.02;color:var(--paper)"></div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};

  // the title arrives word by word (manifest wordStaggerSec 0.2), so each word
  // must be its own element — split here rather than asking the caller for an array
  const host = document.getElementById("m2-title");
  const words = String(vars.title ?? "Автоматизация монтажа").trim().split(/\s+/);
  host.innerHTML = words.map(w =>
    `<span class="m2-word" style="display:inline-block">${w}</span>`).join(" ");

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#m2-kicker", { y: 16, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, 0.05);
  tl.fromTo(".m2-word", { y: 16, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, stagger: 0.2, ease: "circ.out" }, 0.35);
  // drift: the ghost breathes 1→1.05 across the hold, the one linear-ish motion
  // the manifest allows on a background
  tl.to("#m2-ghost", { scale: 1.05, duration: 2.2, ease: "sine.inOut",
                       yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, 0.2);
  tl.to("#root", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.6);

  window.__timelines["mono-02b"] = tl;
</script>
</body>
</html>
