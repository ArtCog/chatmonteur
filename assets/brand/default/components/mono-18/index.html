<!doctype html>
<html data-composition-variables='[
  {"id":"kicker","type":"string","label":"What is being measured","default":"бенчмарк · точность, %"},
  {"id":"rows","type":"string","label":"One per line: name|value","default":"Claude|90\nGPT-5.6|86\nGLM 5.2|80"},
  {"id":"scale","type":"number","label":"Value that fills the track","default":100}
]'>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 18 «бенчмарк» — ported from the designer's source
     (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Full-frame paper card, so it is opaque.

     The leader is filled in ink and everyone else in grey — that is the whole
     comparison, so the component decides it from the values rather than trusting
     whoever wrote the rows to remember. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-18" data-start="0" data-duration="6"
     data-width="1920" data-height="1080"
     style="position:relative;width:1920px;height:1080px;background:#FAFAF7;overflow:hidden">
  <div style="position:absolute;inset:0;background-image:
       linear-gradient(rgba(11,11,12,.05) 2px,transparent 2px),
       linear-gradient(90deg,rgba(11,11,12,.05) 2px,transparent 2px);
       background-size:114px 114px"></div>

  <div style="position:absolute;left:145px;right:145px;top:0;bottom:0;display:flex;
       flex-direction:column;justify-content:center">
    <div data-var-text="kicker" style="font-family:'JetBrains Mono',monospace;font-size:31px;
         letter-spacing:.3em;color:#8A8A85;text-transform:uppercase;margin-bottom:36px">бенчмарк · точность, %</div>
    <div id="m18-rows"></div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  const rows = String(vars.rows ?? "Claude|90\nGPT-5.6|86\nGLM 5.2|80")
    .split("\n").map(s => s.trim()).filter(Boolean)
    .map(line => {
      const [name, value] = line.split("|");
      return { name: (name || "").trim(), value: Number((value || "0").trim()) };
    });
  const scale = Number(vars.scale ?? 100) || Math.max(...rows.map(r => r.value));
  const best = Math.max(...rows.map(r => r.value));

  document.getElementById("m18-rows").innerHTML = rows.map((r, i) => `
    <div style="display:flex;align-items:center;gap:42px;padding:31px 0">
      <div style="width:311px;font-family:'Golos Text',sans-serif;font-weight:700;font-size:44px;
           color:#0B0B0C;text-align:right">${esc(r.name)}</div>
      <div style="flex:1;height:67px;background:#ECECE8;position:relative;overflow:hidden">
        <div class="m18-bar" style="position:absolute;left:0;top:0;bottom:0;
             width:${Math.max(0, Math.min(100, (r.value / scale) * 100))}%;
             background:${r.value === best ? "#0B0B0C" : "#B7B7B2"};transform-origin:left"></div>
      </div>
      <div style="width:145px;font-family:'Playfair Display',serif;font-weight:600;font-size:62px;
           color:#0B0B0C;text-align:right">${esc(String(r.value))}</div>
    </div>`).join("");

  const tl = gsap.timeline({ paused: true });
  // the bars draw together, not in sequence: a benchmark is one comparison, and
  // staggering them would read as a ranking animation
  tl.fromTo(".m18-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "circ.out" }, 0.15);

  window.__timelines["mono-18"] = tl;
</script>
</body>
</html>
