<!doctype html>
<html data-composition-variables='[
  {"id":"title","type":"string","label":"CTA title (use | for a line break)","default":"Смотри|дальше"},
  {"id":"button","type":"string","label":"Button label","default":"Подписаться"}
]'>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 10 «эндкард» — ported from the designer's source
     (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Full-frame ink card.

     The dashed boxes on the designer's card are INSTRUCTIONS, not artwork: they
     mark where YouTube itself draws the subscribe circle (293×293) and the two
     video slots (615×346). Rendering them would put fake placeholders on screen
     under the real widgets, so they are kept as empty reserved space instead. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-10" data-start="0" data-duration="6"
     data-width="1920" data-height="1080"
     style="position:relative;width:1920px;height:1080px;background:var(--ink);overflow:hidden">
  <div style="position:absolute;inset:0;background-image:
       linear-gradient(rgba(250,250,247,.05) 2px,transparent 2px),
       linear-gradient(90deg,rgba(250,250,247,.05) 2px,transparent 2px);
       background-size:114px 114px"></div>

  <!-- The CTA is placed against the reserved zones rather than centred in the
       frame: the subscribe circle occupies the bottom 293px of this column and
       the two video slots take the right half, so the copy is centred in what is
       actually left (the top 735px of the left column). Centring on the frame
       instead pushes the headline off the top edge. -->
  <div id="m10-cta" style="position:absolute;left:135px;top:0;width:790px;height:735px;
       display:flex;flex-direction:column;justify-content:center">
    <div id="m10-title" style="font-family:'Playfair Display',serif;font-weight:600;
         font-size:130px;line-height:1.06;color:var(--paper)"></div>
    <div style="display:inline-flex;align-self:flex-start;align-items:center;gap:26px;
         margin-top:57px;background:var(--paper);color:var(--ink);font-family:'Golos Text',sans-serif;
         font-weight:800;font-size:47px;padding:31px 52px">
      <span data-var-text="button">Подписаться</span>
      <span style="font-family:'JetBrains Mono',monospace;font-weight:700">→</span>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  document.getElementById("m10-title").innerHTML =
    String(vars.title ?? "Смотри|дальше").split("|")
      .map(s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])))
      .join("<br>");

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#m10-cta", { y: 52, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: "circ.out" }, 0.05);
  // no exit: the endcard is the last thing on screen and holds to the cut

  window.__timelines["mono-10"] = tl;
</script>
</body>
</html>
