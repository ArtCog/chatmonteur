<!doctype html>
<html data-composition-variables='[
  {"id":"keys","type":"string","label":"Keys, separated by |","default":"⌘|K"},
  {"id":"caption","type":"string","label":"What the command does","default":"палитра команд"}
]'>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 28 «клавиши / команда» — ported from the designer's source
     (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Overlay, so the page stays transparent.

     The keycap's 5px sole becomes 13px, and the press travels exactly that far —
     the cap has to land ON its own shadow or it reads as a slide, not a press. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-28" data-start="0" data-duration="4"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <!-- flex row instead of the designer's left:50%/translateX(-50%): GSAP owns the
       group's transform for the entry -->
  <div style="position:absolute;left:0;right:0;bottom:145px;display:flex;justify-content:center">
    <div id="m28-group" style="display:flex;flex-direction:column;align-items:center;gap:36px">
      <div id="m28-keys" style="display:flex;align-items:center;gap:26px"></div>
      <div data-var-text="caption" style="background:rgba(8,9,10,.5);font-family:'Golos Text',sans-serif;
           font-weight:600;font-size:47px;color:#FAFAF7;padding:21px 42px">палитра команд</div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  const caps = String(vars.keys ?? "⌘|K").split("|").map(s => s.trim()).filter(Boolean);
  document.getElementById("m28-keys").innerHTML = caps.map((k, i) => {
    const plus = i ? '<span style="font-family:\'JetBrains Mono\',monospace;font-size:52px;color:#8A8A85">+</span>' : "";
    return plus + `<div class="m28-cap" style="background:#FAFAF7;color:#0B0B0C;`
      + `font-family:'JetBrains Mono',monospace;font-weight:700;font-size:67px;line-height:1;`
      + `padding:36px 49px;box-shadow:0 13px 0 #8A8A85">${esc(k)}</div>`;
  }).join("");

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#m28-group", { y: 16, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, 0.05);

  // the keys go down in the order you would actually press them, 0.12s apart
  gsap.utils.toArray(".m28-cap").forEach((cap, i) => {
    tl.to(cap, { y: 13, duration: 0.12, ease: "power2.out" }, 1.1 + i * 0.12);
    tl.to(cap, { y: 0, duration: 0.18, ease: "power2.inOut" }, 1.35 + i * 0.12);
  });
  tl.to("#m28-group", { y: 16, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.6);

  window.__timelines["mono-28"] = tl;
</script>
</body>
</html>
