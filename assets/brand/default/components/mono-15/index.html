<!doctype html>
<html data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker","default":"термин"},
  {"id":"term","type":"string","label":"Term","default":"Инференс"},
  {"id":"definition","type":"string","label":"Definition — wrap the payoff in **stars** to set it in ink","default":"Запуск обученной модели на новых данных — момент, когда нейросеть **выдаёт ответ**, а не учится."}
]'>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 15 «определение термина» — ported from the designer's source
     (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Full-frame paper card, so it is opaque; the
     designer's 1px edge is dropped for the same reason as on the dialogue card.

     He sets two words of the definition in ink to carry the meaning. That is an
     editorial choice per term, so it is written in the variable as **stars** rather
     than frozen into the markup. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-15" data-start="0" data-duration="6"
     data-width="1920" data-height="1080"
     style="position:relative;width:1920px;height:1080px;background:#FAFAF7;overflow:hidden">
  <div style="position:absolute;inset:0;background-image:
       linear-gradient(rgba(11,11,12,.05) 2px,transparent 2px),
       linear-gradient(90deg,rgba(11,11,12,.05) 2px,transparent 2px);
       background-size:114px 114px"></div>

  <div id="m15-card" style="position:absolute;left:145px;right:145px;top:0;bottom:0;
       display:flex;flex-direction:column;justify-content:center;gap:42px">
    <div data-var-text="kicker" style="font-family:'JetBrains Mono',monospace;font-size:31px;
         letter-spacing:.28em;color:#8A8A85;text-transform:uppercase">термин</div>
    <div data-var-text="term" style="font-family:'Playfair Display',serif;font-weight:600;
         font-size:166px;line-height:1.15;color:#0B0B0C">Инференс</div>
    <div style="width:156px;height:8px;background:#0B0B0C"></div>
    <div id="m15-def" style="font-family:'Golos Text',sans-serif;font-size:60px;line-height:1.42;
         color:#3A3A3A;max-width:1557px"></div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
  const raw = String(vars.definition ??
    "Запуск обученной модели на новых данных — момент, когда нейросеть **выдаёт ответ**, а не учится.");
  document.getElementById("m15-def").innerHTML =
    raw.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
       .replace(/\*\*(.+?)\*\*/g, '<b style="color:#0B0B0C">$1</b>');

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#m15-card", { y: 52, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: "circ.out" }, 0.05);
  tl.to("#m15-card", { y: 52, opacity: 0, duration: 0.35, ease: "power2.in" }, 5.6);

  window.__timelines["mono-15"] = tl;
</script>
</body>
</html>
