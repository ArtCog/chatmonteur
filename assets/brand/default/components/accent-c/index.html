<!doctype html>
<html data-composition-variables='[
  {"id":"old","type":"string","label":"Old price (struck)","default":"$200"},
  {"id":"new","type":"string","label":"New price (revealed)","default":"0 ₽"}
]'>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Element C «зачёрк цены» (strike + reveal) — ported 1:1 from the designer's
     source (source/ИИмерсивный - Акцентные плашки.dc.html, 740×416 frame) at the
     manifest's scaleToRender 2.595 → 1920×1080. CSS riseIn/strikeOut/fadeLate
     become one GSAP timeline; CSS animations are not seekable by the renderer. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="accent-c" data-start="0" data-duration="4"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <div id="ac-wrap" style="position:absolute;left:0;right:0;bottom:145px;
       display:flex;justify-content:center;align-items:center;gap:62px">
    <div id="ac-old" style="position:relative">
      <span data-var-text="old" style="font-family:'Playfair Display',serif;font-weight:600;
            font-size:119px;line-height:1;color:#8A8A85">$200</span>
      <span id="ac-strike" style="position:absolute;left:-16px;right:-16px;top:52%;height:10px;
            background:#FAFAF7;transform-origin:left center"></span>
    </div>
    <div id="ac-new" style="background:#FAFAF7;padding:31px 57px">
      <span data-var-text="new" style="font-family:'Golos Text',sans-serif;font-weight:900;
            font-size:119px;line-height:1;color:#0B0B0C">0 ₽</span>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  // Manifest eases: easeEnter (.33,1,.68,1) ≈ circ.out; easeTransition (.45,0,.2,1) ≈ power2.inOut
  const tl = gsap.timeline({ paused: true });

  // The ORDER is the trick, not decoration — the designer's note says so outright:
  // old price stands → gets struck → new one lands 0.35s later. Overlap them and
  // the viewer never sees the "before", so the reveal has nothing to land against.
  tl.fromTo("#ac-old", { y: 67, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.55, ease: "circ.out" }, 0.05);
  tl.fromTo("#ac-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.40, ease: "power2.inOut" }, 0.75);
  tl.fromTo("#ac-new", { y: 36, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.45, ease: "circ.out" }, 1.10);
  tl.to("#ac-wrap", { y: 67, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.55);

  window.__timelines["accent-c"] = tl;
</script>
</body>
</html>
