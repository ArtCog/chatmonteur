<!doctype html>
<html data-composition-variables='[
  {"id":"episode","type":"string","label":"Episode marker","default":"ВЫПУСК 03"},
  {"id":"title","type":"string","label":"Title (use | for a line break)","default":"Claude Code|с нуля"},
  {"id":"subtitle","type":"string","label":"Subtitle (italic)","default":"от установки до первого агента"}
]'>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Mono element 02·D «титульная · слева» — ported 1:1 from the designer's
     source (source/ИИмерсивный - Mono.dc.html, 740×416 frame) at the manifest's
     scaleToRender 2.595 → 1920×1080. Full-frame paper card. CSS clipUp becomes
     a GSAP timeline; CSS animations are not seekable by the renderer. */
  @font-face { font-family: 'Playfair Display'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div id="root" data-composition-id="mono-02d" data-start="0" data-duration="5"
     data-width="1920" data-height="1080"
     style="position:relative;width:1920px;height:1080px;background:#FAFAF7;overflow:hidden">
  <div style="position:absolute;inset:0;background-image:
       linear-gradient(rgba(11,11,12,.05) 2px,transparent 2px),
       linear-gradient(90deg,rgba(11,11,12,.05) 2px,transparent 2px);
       background-size:114px 114px"></div>
  <div data-var-text="episode" style="position:absolute;right:125px;top:114px;
       font-family:'JetBrains Mono',monospace;font-size:31px;letter-spacing:.26em;color:#B7B7B2">ВЫПУСК 03</div>

  <div id="m2d-body" style="position:absolute;left:145px;right:145px;top:0;bottom:0;
       display:flex;flex-direction:column;justify-content:center;gap:47px">
    <div style="width:135px;height:8px;background:#0B0B0C"></div>
    <div id="m2d-title" style="font-family:'Playfair Display',serif;font-weight:600;
         font-size:166px;line-height:1;color:#0B0B0C"></div>
    <div data-var-text="subtitle" style="font-family:'Playfair Display',serif;font-style:italic;
         font-weight:600;font-size:60px;color:#3A3A3A">от установки до первого агента</div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};

  // a two-line title is the designer's layout, but a variable cannot carry markup,
  // so the caller writes "line one|line two" and the break is built here
  document.getElementById("m2d-title").innerHTML =
    String(vars.title ?? "Claude Code|с нуля").split("|")
      .map(s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])))
      .join("<br>");

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#m2d-body", { clipPath: "inset(0 0 100% 0)", opacity: 0 },
            { clipPath: "inset(0 0 0% 0)", opacity: 1, duration: 0.65, ease: "circ.out" }, 0.05);
  tl.to("#root", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.6);

  window.__timelines["mono-02d"] = tl;
</script>
</body>
</html>
