<!doctype html>
<html data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker (mono)","default":"КОНТЕКСТ"},
  {"id":"text","type":"string","label":"Paragraph (max 4 lines / 32 words)","default":"Агент не умеет читать мысли. Вся его точность держится на том, насколько внятно вы описали результат. Плохой промпт — плохой код."}
]'>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* Element M «абзац» (несколько предложений) — ported 1:1 from the designer's
     source (source/ИИмерсивный - Акцентные плашки.dc.html, 740×416 frame) at the
     manifest's scaleToRender 2.595 → 1920×1080. CSS clipIn becomes a GSAP
     timeline; CSS animations are not seekable by the renderer. Held 5–7s per the
     designer's note — the longest-lived plate — hence data-duration 7. */
  @font-face { font-family: 'Golos Text'; src: url('fonts/GolosText.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf'); font-weight: 100 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<div id="root" data-composition-id="accent-m" data-start="0" data-duration="7"
     data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px">
  <!-- only element that spans the frame edge to edge (design 56px insets): it is
       for read-along text while the speech pauses, not for a spoken moment -->
  <div id="am-wrap" style="position:absolute;left:145px;right:145px;bottom:135px;
       display:flex;align-items:stretch">
    <div style="width:13px;background:#FAFAF7"></div>
    <div style="flex:1;background:rgba(8,9,10,.74);padding:42px 57px 47px">
      <div data-var-text="kicker" style="font-family:'JetBrains Mono',monospace;font-size:29px;
           letter-spacing:.26em;color:#B7B7B2;margin-bottom:23px">КОНТЕКСТ</div>
      <div data-var-text="text" style="font-family:'Golos Text',sans-serif;font-weight:500;
           font-size:57px;line-height:1.42;color:#FAFAF7;text-wrap:pretty;max-width:1453px">Агент
        не умеет читать мысли. Вся его точность держится на том, насколько внятно вы описали
        результат. Плохой промпт — плохой код.</div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // clipIn: the block is wiped open from the top down rather than sliding — a
  // paragraph this wide would smear if it travelled
  tl.fromTo("#am-wrap", { clipPath: "inset(0 0 100% 0)", opacity: 0 },
            { clipPath: "inset(0 0 0% 0)", opacity: 1, duration: 0.6, ease: "circ.out" }, 0.05);
  tl.to("#am-wrap", { clipPath: "inset(0 0 100% 0)", opacity: 0,
                      duration: 0.35, ease: "power2.in" }, 6.40);

  window.__timelines["accent-m"] = tl;
</script>
</body>
</html>
