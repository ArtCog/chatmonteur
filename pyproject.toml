[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatmonteur"
version = "0.1.0.dev0"
description = "Agent-orchestrated talking-head video editing — one command, raw footage to finished video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ArtCog" }]
keywords = ["video", "editing", "ffmpeg", "talking-head", "claude-code", "codex", "ai-agents"]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local transcription backend (default, no API key). Installed by setup or `pip install chatmonteur[whisper]`.
whisper = ["faster-whisper>=1.0"]
# Colour emoji in meaning-inserts (libass draws outline glyphs only, so the emoji is
# rendered to a PNG and overlaid). Without it inserts still burn — just text-only.
emoji = ["pillow>=10.0"]
dev = ["pytest>=8.0", "pillow>=10.0"]

[project.scripts]
chatmonteur = "chatmonteur.cli:main"

[project.urls]
Homepage = "https://github.com/ArtCog/chatmonteur"
Issues = "https://github.com/ArtCog/chatmonteur/issues"

[tool.hatch.build.targets.wheel]
packages = ["chatmonteur"]
