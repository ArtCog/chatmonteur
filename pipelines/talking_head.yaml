# Talking-head pipeline: raw footage -> checked mechanical draft, one command.
#
# Every step here is MECHANICAL and safe to run unattended:
#   normalize (CFR + loudnorm −14) -> cut pauses by AUDIO LEVEL (auto-editor)
#   -> transcribe the pause-cleaned draft -> burn subtitles -> color -> render.
#
# The INTELLIGENT cut (fillers, false starts, retakes) is deliberately NOT a
# pipeline step. Per skills/cutting.md Tier 2 (video-use methodology), the
# driving agent reasons over the word-level transcript, writes edl.json, shows
# the cut-plan, and only after user approval executes it via the `cut_edl`
# capability — then re-runs color/render on the result. No detector script
# auto-decides meaning cuts.
#
# The CLI seeds two pseudo-steps:
#   ${source.video}  = the input file
#   ${opts.lut}      = the chosen colour LUT
name: talking_head

steps:
  - id: normalize
    capability: normalize
    params:
      input: "${source.video}"

  - id: cut_silence
    capability: cut_silence
    params:
      input: "${normalize.video}"
      # threshold 0.14 is LOCKED for −14 LUFS-normalised audio (normalize does that).
      threshold: 0.14

  - id: transcribe
    capability: transcribe
    params:
      input: "${cut_silence.video}"

  # Color BEFORE subtitles: grading the frame first, then burning captions as the
  # TOP layer. The reverse (burn then grade) colours the caption pixels —
  # tinting/washing the text and breaking the subtitle standard.
  - id: color
    capability: color
    params:
      input: "${cut_silence.video}"
      lut: "${opts.lut}"

  - id: subtitles
    capability: subtitles
    params:
      input: "${color.video}"
      transcript: "${transcribe.transcript}"
      # Артур 2026-07-26: burn ВЫКЛЮЧЕН по умолчанию — субтитры жгутся ТОЛЬКО когда
      # Артур явно говорит «добавь субтитры» (тогда burn: true). Стиль зафиксирован
      # карточкой 04 (Артур 2026-08-03): скрим + акцент инверсией, без цвета.
      # Текстовый слой канала = смысловые вставки (skills/motion.md).
      # SRT пишется всегда — пригодится YouTube как файл субтитров.
      burn: false
      variant: highlight

  - id: render
    capability: render
    params:
      input: "${subtitles.video}"
      # This unattended path stops before Tier 2, visual storytelling, and the
      # sound pass. Name the artifact for what it is; an agent promotes a later,
      # approval-complete render to a master.
      name: "mechanical-draft.mp4"

  # The gate. Nothing is "done" until a stranger could open the file and find it
  # intact: frames that aren't black, audio that plays and isn't clipped, and the
  # same runtime the encoder was handed. `expected` points at the render's OWN
  # input, so drift is measured against the truth rather than a guess. A failure
  # stops the pipeline and leaves `renders/mechanical-draft.qc.json` as evidence.
  - id: qc
    capability: qc
    params:
      input: "${render.video}"
      expected: "${subtitles.video}"
      delivery: "draft"
